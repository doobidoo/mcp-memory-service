name: "CodeQL Security Analysis"

# CodeQL is the security-analysis lane. The rest of CI lives in ci.yml; this stays
# separate because it reports into the Security tab rather than into check runs, and
# it is the one analysis the Forgejo CI never had an equivalent for.
#
# This job needs no repository secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 00:00 UTC, so coverage does not depend on push frequency.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    # Installed so CodeQL can resolve imports; it improves accuracy and cuts
    # false positives on the storage and web layers.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[sqlite]"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: python
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        category: "/language:python"
