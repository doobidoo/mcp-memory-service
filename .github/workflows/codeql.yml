name: "CodeQL Security Analysis"

# CodeQL is the security-analysis lane. The rest of CI lives in ci.yml; this stays
# separate because it reports into the Security tab rather than into check runs, and
# it is the one analysis the Forgejo CI never had an equivalent for.
#
# This job needs no repository secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 00:00 UTC, so coverage does not depend on push frequency.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    # Installed so CodeQL can resolve imports; it improves accuracy and cuts
    # false positives on the storage and web layers.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --only-upgrade ca-certificates
        python scripts/ci/bootstrap_pip.py --cert /etc/ssl/certs/ca-certificates.crt
        pip install -e ".[sqlite]"
    
    # Create results directory for SARIF export
    - name: Create results directory
      run: mkdir -p results

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: python
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:python"
        output: results

    - name: Upload SARIF to Artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.3.1
      with:
        name: codeql-sarif
        path: |
          results
          **/*.sarif
        retention-days: 30
        if-no-files-found: warn
