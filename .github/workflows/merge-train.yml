# Keeps the auto-merge queue moving: brings the oldest PR with auto-merge
# enabled up to date with main, one at a time. GitHub merges it once it is
# green, approved and has no open threads. Logic: scripts/ci/merge_train.py.
#
# The branch update has to come from a GitHub App token. A push made with
# GITHUB_TOKEN starts no workflows, so CI would never run on the updated branch.
# Setup: repository variable MERGE_TRAIN_CLIENT_ID (the App's client ID) and
# secret MERGE_TRAIN_PRIVATE_KEY. Until the variable exists the job is skipped.
#
# The second step tells PR authors what blocks their PR (open review threads, a
# conflict with main, a red changelog or tests-prove-fix check). It rides on this
# job so that it adds no runs of its own, and because scheduled workflows are
# throttled here: push to main is the trigger that fires reliably. It posts with
# GITHUB_TOKEN, as github-actions[bot]. Logic: scripts/maintenance/github_pr_notice.py.
name: Merge Train

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-train
  cancel-in-progress: false

jobs:
  train:
    if: vars.MERGE_TRAIN_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write   # PR notices, posted as github-actions[bot]
      checks: read           # check runs on the PR head
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      id: app-token
      with:
        client-id: ${{ vars.MERGE_TRAIN_CLIENT_ID }}
        private-key: ${{ secrets.MERGE_TRAIN_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-checks: read     # statusCheckRollup / CheckRun in the queue query
        permission-statuses: read   # StatusContext in the same query

    - name: Move the queue
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: python3 scripts/ci/merge_train.py

    - name: Tell authors what blocks their PR
      # Runs even when the queue step failed, and never fails the job.
      if: ${{ !cancelled() }}
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/maintenance/github_pr_notice.py --post >> "$GITHUB_STEP_SUMMARY"
