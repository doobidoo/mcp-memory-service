          - text: by running my test suites against it... but I hadn't done this during the RC period, so that bug had already shipped! Since then I've always paid much closer attention to these RCs.
        - paragraph [ref=e37]:
          - text: The new RC isn't available for GitHub Actions just yet - keep an eye on
          - link "actions/python-versions" [ref=e38] [cursor=pointer]:
