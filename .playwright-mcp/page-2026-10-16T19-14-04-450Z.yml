      - generic [ref=e330]:
        - paragraph [ref=e331]:
          - strong [ref=e332]:
            - link "GPT‑6 Astra" [ref=e333] [cursor=pointer]:
              - /url: https://openai.com/index/gpt-6-astra/
          - text: (
          - link "via" [ref=e334] [cursor=pointer]:
            - /url: https://news.ycombinator.com/item?id=49554643
          - text: ) GPT-6 Astra is "rolling out today to a limited set of organizations and over the coming days will become available to all ChatGPT Plus, Pro, Business, and Enterprise users, as well as through the OpenAI API and AWS" - I've not tried it yet myself, so I don't have a great deal to say about it yet.
        - paragraph [ref=e335]: "It's going to be API priced at the same rate as Claude Fable 5 and 5.1: $10/million input and $50/million output. This is clearly OpenAI's Fable competitor, and appears to score higher than Fable on most of OpenAI's self-reported benchmarks."
        - paragraph [ref=e336]:
          - text: Most impressively, Astra scores 99.9% on the recent (released in March)
          - link "ARC-AGI 3 benchmark" [ref=e337] [cursor=pointer]:
            - /url: https://arcprize.org/arc-agi/3
          - text: "- though notably Fable 5 does not yet have a published result, and the"
          - link "ARC-AGI blog notes" [ref=e338] [cursor=pointer]:
            - /url: https://arcprize.org/blog/astra
          - text: that the 99.9% score was achieved for $19K using OpenAI's custom "Provider Adapter harness", while the default ARC-AGI harness scored 62.7% for $26K.
        - blockquote [ref=e339]:
          - paragraph [ref=e340]: The Provider Adapter harness preserves opaque reasoning state between requests and uses compaction for longer conversations, allowing the model to reuse prior work.
        - paragraph [ref=e341]:
          - text: Unsurprisingly, given
          - link "the recent Hugging Face incident" [ref=e342] [cursor=pointer]:
            - /url: https://simonwillison.net/tags/openai-hugging-face-incident/
          - text: ", Astra is a beast at security tasks. It scores 100% on ExploitBench (GPT-5.6 Sol got 78.5%), 42.4% on ExploitGym (Sol got 30.3%), and 99.2% within four attempts on SRE-Bench binary reverse engineering compared to Sol's 68.7%."
        - paragraph [ref=e343]: "It's also better at long context: on OpenAI's eight-needle benchmark it got 100% at 256K–512K tokens and 96.3% at 512K–1M tokens. OpenAI may have vanquished one of the ongoing challenges with long context processing."
        - paragraph [ref=e344]:
          - text: It doesn't win at everything though.
          - link "Artificial Analysis" [ref=e345] [cursor=pointer]:
            - /url: https://twitter.com/ArtificialAnlys/status/2095595489031000350
          - text: "note that Astra is still beaten by Fable on their Intelligence Index:"
        - blockquote [ref=e346]:
          - paragraph [ref=e347]:
            - strong [ref=e348]: Sits beside GPT-5.6 Sol in Intelligence
            - text: ": GPT-6 Astra scores equal to GPT-5.6 Sol in the Index at 61. This is 5 points lower than Claude Fable 5.1 (max with fallback). The model also trails Meta’s newly released Muse Spark 1.3 (max)."
        - paragraph [ref=e349]: "It did better on their Coding Agent Index:"
        - blockquote [ref=e350]:
          - paragraph [ref=e351]:
            - strong [ref=e352]: Leads Coding Agent Index cost efficiency frontier
            - text: ": At max effort, GPT-6 Astra costs about the same as GPT-5.6 Sol (max) while scoring 2 points higher on the Index. Per task, the model is less than half the cost of Claude Fable 5, for the same score."
        - paragraph [ref=e353]:
          - text: I'll write more about Astra once I get access to it. The API model label once it rolls out will be
          - code [ref=e354]: gpt-6-astra
          - text: .
