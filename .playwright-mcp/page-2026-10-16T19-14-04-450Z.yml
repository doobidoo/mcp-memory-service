          - link "My comment" [ref=e528] [cursor=pointer]:
            - /url: https://lobste.rs/s/rfn2mn/there_s_no_limit_how_bad_code_can_get#c_8kdtaw
          - text: "on"
          - link "There's No Limit to How Bad Code Can Get" [ref=e529] [cursor=pointer]:
            - /url: https://lobste.rs/s/rfn2mn/there_s_no_limit_how_bad_code_can_get
          - text: — Lobste.rs
        - paragraph [ref=e530]:
          - emphasis [ref=e531]: "[In reply to a comment about burning it down to start from scratch when technical debt becomes overwhelming]"
        - paragraph [ref=e532]:
          - text: In my experience it's
          - emphasis [ref=e533]: so rare
          - text: for that to work.
        - paragraph [ref=e534]: You announce the old thing is irrecoverably drowning in tech debt. You spin up a team to rewrite it from scratch. Work begins.
        - paragraph [ref=e535]: "Meanwhile the old thing remains a moving target: it's running the core business, so changes are still necessary. The developers working on it know that it's going to be made obsolete by the new thing soon, so they don't have any incentive to go beyond the smallest effort possible to add the new features. Technical debt continues to mount."
        - paragraph [ref=e536]:
          - text: Meanwhile, the team working on the new thing are ambitious and probably a little naive. They start out at a great pace - it's greenfield after all - but as time progresses it becomes apparent that nobody fully understands the behavior and scope of the thing they are replacing. If it was well documented and tested it wouldn't
          - emphasis [ref=e537]: need
          - text: to be replaced, after all...
        - paragraph [ref=e538]: After months (or even years) without delivering value, the pressure is on to "ship it", so the new system is launched to handle a subset of what the old system handled - or often for some new feature that was too hard to build with the now mostly unmaintained old system.
        - paragraph [ref=e539]: ... so now you have TWO systems in production - the janky old system that nobody wants to touch, and a new system which handles just a few production features and is 80% inactive code that is meant to replace the old system, eventually.
        - paragraph [ref=e540]:
          - text: If you're
          - emphasis [ref=e541]: really lucky
          - text: the company won't have lost patience with the new system and will allow that work to continue. The longer this all takes, and the longer the old system stays in production and stubbornly continues to work, the higher the risk that "priorities have changed" and the new system total replacement work is abandoned, leaving you with two systems where you used to have one.
        - paragraph [ref=e542]:
          - text: The best article I've read about completing this process responsibly is
          - 'link "Migrations: the sole scalable fix to tech debt" [ref=e543] [cursor=pointer]':
            - /url: https://lethain.com/migrations/
          - text: by Will Larson.
        - paragraph [ref=e544]: If I run into a situation like this in the future, my strong recommendation will be to shore up the old system with as much automated testing as possible and then seeing if targeted refactors can get it to the desired shape. My hunch is that in many cases that will have a much higher chance of success than the siren call of a greenfield replacement.
