          - text: ") Hugo van Kemenade (release manager for Python 3.14 and 3.15) announces the final release candidate for Python 3.15, scheduled for release in October:"
        - blockquote [ref=e30]:
          - paragraph [ref=e31]: Entering the release candidate phase, only reviewed code changes which are clear bug fixes are allowed between this release candidate and the final release. [...]
          - paragraph [ref=e32]:
            - text: We
            - strong [ref=e33]: strongly encourage
            - text: maintainers of third-party Python projects to prepare their projects for 3.15 during this phase, and publish Python 3.15 wheels on PyPI to be ready for the final release of 3.15.0, and to help other projects do their own testing. Any binary wheels built against Python 3.15.0 release candidates
            - strong [ref=e34]: will work
