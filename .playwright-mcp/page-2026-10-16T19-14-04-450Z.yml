          - text: "for that. For the moment though you can add this to a testing matrix:"
        - generic [ref=e40]: "strategy: matrix: python-version: [\"3.14\", \"3.15\"] steps: - uses: actions/setup-python@v7 with: python-version: ${{ matrix.python-version }} allow-prereleases: true check-latest: true"
        - paragraph [ref=e41]:
          - text: The
          - link "allow-prereleases" [ref=e42] [cursor=pointer]:
