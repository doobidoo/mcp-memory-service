      - generic [ref=e166]:
        - blockquote [ref=e167]:
          - paragraph [ref=e168]:
            - text: Direct2D has always been the biggest hurdle for Paint.NET on WINE, and it's clear that it will never be completed enough for Paint.NET's use. And I can't just "disable" the use of Direct2D. So, instead,
            - strong [ref=e169]: Paint.NET now has an internal, from-scratch, clean-room reverse-engineered rewrite of Direct2D that it uses on WINE
            - text: (triggered by using
            - strong [ref=e170]: /wine
            - text: ). It lives in
            - strong [ref=e171]: PaintDotNet.Windows.Direct2D1.Managed.dll
            - text: . This was written by our good friend
            - link "Claude" [ref=e172] [cursor=pointer]:
              - /url: https://claude.ai/
            - text: ", without whom this would NOT have been possible and would NEVER have happened. [...]"
          - paragraph [ref=e173]:
            - text: Most of this code is, as they say, "vibe coded." By that I mean that it has not been thoroughly reviewed, it's more "trust me bro" style. I cannot possibly review 180,000 lines of code, it's just way way
            - emphasis [ref=e174]: way
            - text: too much. For reference, the rest of Paint.NET is about 700,000 lines of code and I've been working on it for over 20 years. [...]
          - paragraph [ref=e175]: At times, Claude was working with the fury of 10 freshly unshackled Einstein genius-level 10x coders. And other times ... well, not so much. I had to babysit Claude quite a bit to make sure it did resource management correctly (for awhile it just wasn't doing the COM equivalent of AddRef() for reference counted objects, oops). I had to slap it a few times when I found some really bad design or architecture decisions. And I was also impressed at some rather clever and tireless reverse engineering work it did to figure out all the formulas needed for implementing Direct2D's built-in effects library.
        - paragraph [ref=e176]:
          - text: —
          - link "Rick Brewster" [ref=e177] [cursor=pointer]:
            - /url: https://forums.paint.net/topic/134563-🍷-extremely-experimental-winelinux-support-how-to-get-started/
          - text: ", author of Paint.NET"
