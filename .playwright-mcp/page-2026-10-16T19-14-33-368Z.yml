        - generic [ref=e20]:
          - paragraph [ref=e21]:
            - text: I built this little web app the other day to help edit the commit messages for the
            - link "Datasette security releases" [ref=e22] [cursor=pointer]:
              - /url: https://datasette.io/blog/2026/september-security-releases/
            - text: . The initial commits were full of coding agent cruft and references to issue IDs from our private repository, so they weren't fit for publication.
          - paragraph [ref=e23]: "If you want to edit the commit messages for a repository you can run it like this:"
          - code [ref=e25]: uvx commit-rewriter path/to/repo
          - paragraph [ref=e26]: Omit the path if you are already in the directory for that repo.
          - paragraph [ref=e27]:
            - img "Screenshot of the commit-rewriter web interface. A heading reads commit-rewriter above the repository path and current branch and commit hash, with a short description of the tool. A toolbar shows a pending edits count with Discard drafts and Rewrite commit messages buttons, followed by a search box for message, author, or hash and an Edited only checkbox. A left sidebar titled Navigate commits lists recent commit messages with their short hashes. The main panel shows a card for each commit with its hash, author and timestamp, an editable text area containing the commit message, and a View full formatted diff toggle." [ref=e28]
          - paragraph [ref=e29]: When you submit your edits the tool creates a timestamped branch of your current repo state - to allow you to revert if you need to - and then rewrites every commit from the first one you edited to the most recent.
