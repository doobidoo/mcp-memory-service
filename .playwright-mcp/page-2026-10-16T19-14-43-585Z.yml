        - paragraph [ref=e29]:
          - strong [ref=e30]:
            - link "Claude Cowork and chat are now one Claude" [ref=e31] [cursor=pointer]:
              - /url: https://claude.com/blog/cowork-is-now-claude
          - text: (
          - link "via" [ref=e32] [cursor=pointer]:
            - /url: https://news.ycombinator.com/item?id=49729412
          - text: ") In hopefully good news for anyone who, like me, was increasingly confused at Cowork v.s. Claude v.s. Claude Code:"
        - blockquote [ref=e33]:
          - paragraph [ref=e34]: Starting today, Claude Cowork and chat are merging into one Claude. Bring a quick question, or hand over a report due at noon, and Claude takes it from there, even after you’ve closed your laptop. [...]
          - paragraph [ref=e35]: This is rolling out to Pro and Max plans first, in the Claude app on web, desktop, and mobile over the coming weeks to existing and new users on these plans.
        - paragraph [ref=e36]:
          - text: I guess this means Claude is becoming a
          - strong [ref=e37]: general agent
          - text: in its own right. Echoes of OpenAI renaming their Codex desktop app to ChatGPT a few weeks ago.
        - paragraph [ref=e38]:
          - text: On the one hand, this saves me some work, in that I was planning to finally figure out the boundaries between Cowork and regular Claude and write a follow-up to my piece on
          - link "Understanding ChatGPT Work" [ref=e39] [cursor=pointer]:
            - /url: https://simonwillison.net/2026/Aug/30/understanding-chatgpt-work/
          - text: .
        - paragraph [ref=e40]: I have a hunch that figuring out what this actually means in terms of features and surfaces is still going to take quite a bit of work.
