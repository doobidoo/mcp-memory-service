      - generic [ref=e63]:
        - paragraph [ref=e64]:
          - strong [ref=e65]:
            - link "How To Write With An LLM" [ref=e66] [cursor=pointer]:
              - /url: https://sockpuppet.org/blog/2026/09/17/how-to-write-with-an-llm/
          - text: ". Thomas Ptacek on using LLMs as copyeditors, not as writing assistants:"
        - blockquote [ref=e67]:
          - paragraph [ref=e68]:
            - strong [ref=e69]: "Rule Number One: You may not use a single word an LLM suggests to you."
          - paragraph [ref=e70]: "[...] I think that as a form of intellectual personal protective equipment you should adopt the rule that any specific turn of phrase an LLM suggests is off limits. Be strict about the rule!"
        - paragraph [ref=e71]:
          - text: I won't let LLMs write content for my blog, but I use them for fact-checking, spelling and grammar and as an occasional thesaurus (see
          - link "my proofreading prompt" [ref=e72] [cursor=pointer]:
            - /url: https://simonwillison.net/guides/agentic-engineering-patterns/prompts/#proofreader
          - text: ).
        - paragraph [ref=e73]: The rule to never use a turn of phrase suggested by an LLM feels good to me. The text has that weird smell to it, and it's also a good principle to help stay disciplined.
        - paragraph [ref=e74]:
          - text: Later in this piece Thomas shows a screenshot of his personal LLM copyediting tool (see also
          - link "this Twitter thread" [ref=e75] [cursor=pointer]:
            - /url: https://x.com/tqbf/status/2100414465187475821
          - text: ), and provides a prompt to help kickstart building your own.
        - paragraph [ref=e76]:
          - strong [ref=e77]: Update
          - text: ": Thomas also"
          - link "shared his system prompt" [ref=e78] [cursor=pointer]:
            - /url: https://news.ycombinator.com/item?id=49747070#49753616
