      - generic [ref=e87]:
        - paragraph [ref=e88]:
          - strong [ref=e89]:
            - 'link "Be alert: targeted attacks on prominent Rustaceans" [ref=e90] [cursor=pointer]':
              - /url: https://blog.rust-lang.org/2026/09/17/targeted-attacks/
          - text: ". Important warning from Adam Harvey and the crates security team:"
        - blockquote [ref=e91]:
          - paragraph [ref=e92]: We believe that there is an ongoing campaign targeting rust-lang members and owners of popular crates that is attempting to compromise devices and accounts in order to use them to publish malware.
          - paragraph [ref=e93]: A video call is set up for something positive — maybe for a job, maybe for a project, maybe for a contract opportunity — and then that's used as a vector to either get the target to install something on their computer (such as a purportedly missing audio codec) or execute another command (for example, via putting a command on the clipboard).
        - paragraph [ref=e94]:
          - text: Last month this trick was used in a successful
          - link "supply chain attack against the array ref crate" [ref=e95] [cursor=pointer]:
            - /url: https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/
          - text: ", among others."
        - paragraph [ref=e96]:
          - text: Any piece of software that depends on open source (which is almost
          - emphasis [ref=e97]: every
          - text: piece of software) has a network of human beings who are potential attack vectors - everyone with publishing rights to any of the packages in the dependency network for that software.
        - paragraph [ref=e98]:
          - text: I guess our best defense right now is
          - link "dependency cooldowns" [ref=e99] [cursor=pointer]:
            - /url: https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
          - text: "- giving new package releases a few days before upgrading to them, in the hope that supply chain attacks like this will be spotted by someone else."
