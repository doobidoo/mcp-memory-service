            - heading "Tackling technical debt at scale with autonomous mode in Kiro Web" [level=1] [ref=e75]
            - generic [ref=e76]:
              - generic [ref=e77]: By
              - generic [ref=e78]:
                - generic [ref=e79]:
                  - generic [ref=e81]: MI
                  - generic [ref=e82]:
                    - paragraph [ref=e83]: Michael Tautschnig
                    - paragraph [ref=e84]: Applied Science
                - link "RA Rajdeep Mukherjee Applied Science" [ref=e85] [cursor=pointer]:
