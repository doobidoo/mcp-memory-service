                - img [ref=e232]
            - paragraph [ref=e235]: Understanding where Kiro failed was as important as its successes because it shaped work assignments and review expectations.
            - paragraph [ref=e236]:
              - strong [ref=e237]: Incorrect fixes that pass CI.
              - text: "In CBMC PR #8892, a regression test used"
              - code [ref=e238]: "--no-library"
              - text: while calling
              - code [ref=e239]: memcpy
              - text: ", so the triggering code path was never exercised. The test passed with or without the fix. We replaced it with a unit test that directly exercised the affected function."
              - strong [ref=e240]: "Lesson: CI passing is necessary but not sufficient; reviewers must verify that tests validate the fix."
            - paragraph [ref=e241]:
              - strong [ref=e242]: Architecturally wrong fixes.
              - text: "Some fixes addressed symptoms rather than root causes. In PR #8703, a 172-line restructuring broke nested quantifiers; the correct fix was 9 lines in the original location. These cases require reviewers with architectural knowledge, and Kiro also sometimes rebuilt functionality instead of using existing utilities."
            - paragraph [ref=e243]:
              - strong [ref=e244]: Platform-specific failures.
              - text: "Because Kiro develops on Linux, platform issues can slip through. PR #8894 used empty structs ("
              - code [ref=e245]: "struct S {}"
              - text: ), valid as a GCC extension but rejected in MSVC mode. The fix was adding a gcc-only tag, despite an existing test already demonstrating the relevant platform guard.
            - paragraph [ref=e246]:
              - strong [ref=e247]: Formatting violations and stale PRs.
              - text: "Nearly every PR had minor formatting issues. Unreviewed PRs also accumulate conflicts: PR #7861 was 1,614 commits behind"
              - code [ref=e248]: develop
              - text: ", requiring non-trivial rebasing. Prompt review is essential to avoid compounding costs."
