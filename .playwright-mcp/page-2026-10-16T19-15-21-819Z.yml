            - paragraph [ref=e271]:
              - strong [ref=e272]: Why two phases work.
              - text: The autonomous agent eliminates the cold-start problem. By review time, there is working code, passing tests, and a clear approach description. The interactive CLI eliminates asynchronous back-and-forth latency, resolving issues in minutes instead of hours. Neither phase requires the maintainer to write code directly.
            - paragraph [ref=e273]:
              - strong [ref=e274]: Qualitative impact.
              - text: "Rahul Kumar, Senior Manager of Applied Science in the AWS Automated Reasoning Group: “Kiro has fundamentally changed how we approach technical debt. Previously, submodule updates would sit in our backlog for weeks because they required context-switching from feature work. Now we label the issue with kiro and it handles the entire workflow, update, test, document. In November alone, we merged 15 Kiro-generated PRs into Kani with zero regressions.”"
            - paragraph [ref=e275]: By handling routine maintenance, Kiro frees developers to focus on architectural decisions, complex algorithm design, community engagement, and research in formal verification.
