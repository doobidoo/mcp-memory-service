            - paragraph [ref=e256]:
              - text: The limitations described above were real, but they are not the end of the story. Every one of them was resolved without a developer opening an editor or IDE. Using
              - link "Kiro CLI" [ref=e257] [cursor=pointer]:
                - /url: /cli/
              - text: ", maintainers start a"
              - code [ref=e258]: kiro-cli chat
              - text: session on the PR branch and guide fixes through conversation. The maintainer provides judgment; the agent provides execution. This two-phase workflow (autonomous generation, then interactive refinement) combines the strengths of both modes and keeps the total time cost well below a developer performing each task end-to-end.
