              - text: ". A fuzzer had reported a Kani compiler crash with clear reproduction steps, but root-causing it required a substantial context switch. This is deliberate triage rather than neglect: issues that block users or threaten soundness are fixed immediately, while a fuzzer-found crash with no affected users loses the prioritization contest every time, it demands the same expensive context switch as a user-blocking bug, without the same payoff. After we added the"
