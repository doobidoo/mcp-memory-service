              - text: Git submodule to obtain an intermediate representation of Rust programs for alternative verification workflows. Unlike other submodules updated automatically through
              - link "Dependabot" [ref=e154] [cursor=pointer]:
                - /url: https://docs.github.com/en/code-security/dependabot
              - text: ", charon updates require integration testing because translation-layer changes can affect Kani’s ability to model Rust semantics correctly. A manual update typically takes 2–3 hours, covering the submodule update, compilation and build-failure investigation, upstream change analysis, regression testing, and test-failure investigation. Rather than repeatedly spending developer time on this work, we handed the process to Kiro, which handles it autonomously."
