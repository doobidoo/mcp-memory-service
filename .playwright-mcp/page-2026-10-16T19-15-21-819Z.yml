          - generic [ref=e91]:
            - paragraph [ref=e92]:
              - text: "Every software development team has experienced the tension between maintenance and building new features: time spent on one is time not spent on the other. For open-source maintainers, this challenge is even more acute with smaller teams, larger user bases, and a backlog that never stops growing. In"
              - link "formal verification" [ref=e93] [cursor=pointer]:
                - /url: https://www.amazon.science/blog/a-decade-of-mathematical-certainty-reflections-on-the-automated-reasoning-group
              - text: ", the use of mathematical techniques to prove properties of software and the complexity of the domain makes this especially painful. The"
              - link "AWS Automated Reasoning Group" [ref=e94] [cursor=pointer]:
                - /url: https://aws.amazon.com/blogs/security/protect-sensitive-data-in-the-cloud-with-automated-reasoning-zelkova/
              - text: maintains or is a principal contributor to several open-source formal verification tools, including the
              - link "Kani Rust Verifier" [ref=e95] [cursor=pointer]:
                - /url: https://model-checking.github.io/kani/
              - text: and the
              - link "C Bounded Model Checker (CBMC)" [ref=e96] [cursor=pointer]:
                - /url: https://www.cprover.org/cbmc/
              - text: . In November 2025, when we began the work described in this post, these repositories had 916 open issues, with maintenance tasks accumulating faster than the team could address them while continuing to advance core verification capabilities.
            - paragraph [ref=e97]:
              - text: Traditional approaches to technical debt force a choice between allocating developer time to maintenance (and slow feature delivery) or letting debt compound. Interactive AI coding assistants help speed up individual tasks but still require a developer actively in the loop for every step. We wanted a third option that takes a maintenance task end-to-end, from reading the issue to opening a pull request, so engineers only step in at code review, where their judgment matters most. That tool is
              - link "Kiro’s autonomous mode" [ref=e98] [cursor=pointer]:
                - /url: /web/
              - text: in Web, an agentic software engineering tool that can perform a range of tasks, including maintenance, while engineers focus on higher-value work. Here is what that looks like in practice. Over two months, Kiro submitted pull requests addressing 87 open issues across our repositories, a volume approaching what the team had addressed during the prior 22 months (about 2 years).
            - paragraph [ref=e99]: In this post, we describe how we set this up, share two case studies in detail, and explain how to use Kiro autonomously on your own repository.
            - generic [ref=e100]:
              - heading "How Kiro’s autonomous mode works" [level=2] [ref=e101]
              - link "Copy link to How kiros autonomous mode works section" [ref=e102] [cursor=pointer]:
                - /url: "#how-kiros-autonomous-mode-works"
                - img [ref=e104]
            - paragraph [ref=e107]:
              - link "Kiro" [ref=e108] [cursor=pointer]:
                - /url: /web/
              - text: "in autonomous mode operates autonomously in its own secure cloud development environment while integrating with existing workflows. Assigning work to Kiro is simple: describe the task on"
              - link "app.kiro.dev" [ref=e109] [cursor=pointer]:
                - /url: https://app.kiro.dev/agent
              - text: ", add the"
              - code [ref=e110]: kiro
              - text: label to a GitHub issue, or mention
              - code [ref=e111]: /kiro
              - text: in a comment. Kiro then clones the repository into an isolated sandbox, analyzes the issue and related code, breaks the work into steps, implements the changes, runs the full test suite, and opens a pull request. Every pull request is subject to the same approval requirements as human-authored code, including passing CI and code-owner review. Kiro never merges pull requests automatically and cannot bypass branch protection rules.
            - paragraph [ref=e112]: The tasks most suitable for this approach are those with clear acceptance criteria and isolated scope. Dependency updates, well-reproduced bug fixes, and documentation improvements are all good starting options. Tasks requiring architectural decisions or crosscutting refactors are better left to humans. When Kiro encounters ambiguity, it asks clarifying questions rather than guessing. In our deployment across the Kani and CBMC repositories, we have observed zero regressions introduced by the merged Kiro-generated code.
            - generic [ref=e113]:
              - heading "Quantitative impact" [level=2] [ref=e114]
              - link "Copy link to Quantitative impact section" [ref=e115] [cursor=pointer]:
                - /url: "#quantitative-impact"
                - img [ref=e117]
            - paragraph [ref=e120]: "We started using Kiro in autonomous mode on the Kani repository in early November 2025 and expanded to CBMC later that month. Across both repositories, the numbers show the positive impact:"
            - list [ref=e121]:
              - listitem [ref=e122]:
                - strong [ref=e123]: Code maintenance
                - text: "(29%): Dependency updates, toolchain upgrades, CI improvements, and refactoring"
              - listitem [ref=e124]:
                - strong [ref=e125]: Documentation improvements
                - text: "(4%): Updates to project documentation and build instructions"
              - listitem [ref=e126]:
                - strong [ref=e127]: Bug fixes
                - text: "(36%): Resolution of reported issues, including crashes, incorrect results, and invariant violations"
              - listitem [ref=e128]:
                - strong [ref=e129]: Feature completion
                - text: "(26%): Addressing documented gaps in prototype features"
            - paragraph [ref=e130]: "The following chart shows monthly pull request activity in the CBMC repository. For most of 2025, the repository averaged fewer than 2 resolved issues per month. In November, that jumped to 60. Many of these pull requests are still working through review: of the 64 Kiro-submitted PRs in CBMC for November, 16 have been merged, 47 remain open, and 1 was closed because the underlying issue was resolved by another change, as of September 2026. Each one addresses a documented open issue. Across both CBMC and Kani, Kiro submitted pull requests addressing 87 unique issues in November and December 2025. In the prior 22 months (January 2024 through October 2025), the team addressed 94 issues total across both repositories."
            - 'figure "Figure 1: Monthly pull request activity in the CBMC repository from January 2024 through December 2025. For most of 2025, fewer than 2 issues were resolved per month. In November 2025, when Kiro was introduced, this jumped to 60 issues addressed across 65 pull requests opened." [ref=e132]':
              - 'button "Open image lightbox: Bar chart titled CBMC Repository: Monthly Pull Request Activity, January 2024 to December 2025, with blue bars for PRs opened and orange bars for issues addressed; issues addressed are near zero in most months until a dashed line labeled Kiro starts at November 2025, where 65 PRs were opened and 60 issues addressed" [ref=e133]':
                - generic [ref=e134]:
                  - generic [ref=e136]: Loading image...
                  - 'img "Bar chart titled CBMC Repository: Monthly Pull Request Activity, January 2024 to December 2025, with blue bars for PRs opened and orange bars for issues addressed; issues addressed are near zero in most months until a dashed line labeled Kiro starts at November 2025, where 65 PRs were opened and 60 issues addressed" [ref=e137]'
                - img [ref=e139]
              - generic [ref=e142]: "Figure 1: Monthly pull request activity in the CBMC repository from January 2024 through December 2025. For most of 2025, fewer than 2 issues were resolved per month. In November 2025, when Kiro was introduced, this jumped to 60 issues addressed across 65 pull requests opened."
            - paragraph [ref=e143]: "Of the 94 pull requests Kiro submitted across CBMC and Kani in November and December 2025, as of September 2026, 35 (37%) have been merged, 56 (60%) remain open and under review, and 3 (3%) were closed because the underlying issues were resolved by other changes. Of the merged PRs, some were merged as submitted while others required interactive refinement. The review backlog reflects a key bottleneck: Kiro can generate PRs faster than the team can review them. These were substantial changes: the median PR touched 5 files and ~110 lines, while the largest touched about 1,000 files. At 2–3 hours of focused developer effort per task, the 94 PRs represent roughly 200–280 hours of implementation effort, excluding review time and PRs that may not ultimately merge; because many tasks involve bug fixes or feature completion rather than mechanical updates, this is best viewed as a lower bound."
            - paragraph [ref=e144]: "The throughput shift is equally striking: CBMC averaged fewer than 2 resolved issues per month across the 22 months before Kiro, while November 2025 saw 60 resolved issues, a more than 30× increase. Nearly all of November’s 65 opened PRs (64) were Kiro-submitted, indicating that the spike reflects added agent capacity rather than redirected developer effort. Overall, Kiro generated implementation work at roughly 10× the team’s historical issue-resolution throughput, although realized value depends on review and refinement capacity. The merged PRs continue to introduce zero regressions, a signal that now rests on a much larger base: across the full deployment (November 2025 through September 2026), 183 Kiro-generated pull requests have been merged across the two repositories. The 56 still-open PRs from the initial cohort reflect the review bottleneck discussed above rather than quality concerns, and the zero-regression record will continue to be re-evaluated as they clear review."
