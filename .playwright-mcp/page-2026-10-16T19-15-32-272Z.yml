            - time [ref=e98]: September 14, 2026
            - heading "GPT‑5.6 models now support 1 million token context windows in Kiro" [level=1] [ref=e99]
            - generic [ref=e100]:
              - generic [ref=e101]: By
              - link "VI Vipin Mohan Product" [ref=e103] [cursor=pointer]:
                - /url: https://github.com/vipin-mohan/
                - generic [ref=e105]: VI
                - generic [ref=e106]:
                  - paragraph [ref=e107]: Vipin Mohan
                  - paragraph [ref=e108]: Product
          - generic [ref=e109]:
            - paragraph [ref=e110]:
              - text: Starting today, GPT‑5.6 Sol, Terra, and Luna support 1 million token context windows in Kiro, across the
              - link "IDE" [ref=e111] [cursor=pointer]:
                - /url: /ide/
              - text: ","
              - link "CLI" [ref=e112] [cursor=pointer]:
                - /url: /cli/
              - text: ", and"
              - link "Web" [ref=e113] [cursor=pointer]:
                - /url: /web/
              - text: . You can now use GPT‑5.6 models to process entire codebases, long-form documents, and extended multi-turn agent histories in a single request, without chunking, summarization, or loss of detail.
            - generic [ref=e114]:
              - heading "What changes with 1M context" [level=2] [ref=e115]
              - link "Copy link to What changes with 1m context section" [ref=e116] [cursor=pointer]:
                - /url: "#what-changes-with-1m-context"
                - img [ref=e118]
            - paragraph [ref=e121]: The jump from 272K to 1M tokens changes what kind of work is possible in a single pass, not just how much.
            - paragraph [ref=e122]:
              - strong [ref=e123]: Repository-scale understanding.
              - text: For code review, migration, and refactoring, the larger context window eliminates the need to manually stage context or rely on semantic search to approximate what the model doesn't have in view. Legacy migrations, dependency mapping, and cross-file architectural audits can run against the full codebase, not a curated slice of it.
            - paragraph [ref=e124]:
              - strong [ref=e125]: End-to-end debugging.
              - text: Many hard bugs don't live in a single file. They emerge from the interplay between an API layer, a schema, and application state. With 1M context, you can supply your full application alongside multi-turn execution logs and tool outputs, without compressing earlier steps out of memory.
            - paragraph [ref=e126]:
              - strong [ref=e127]: Long-horizon agentic tasks.
              - text: For multi-step agentic work, the larger context means the full history of a session (code iterations, compiler output, terminal logs) stays in view. That translates to less re-prompting and more reliable task completion across longer runs.
            - generic [ref=e128]:
              - heading "Pricing" [level=2] [ref=e129]
              - link "Copy link to Pricing section" [ref=e130] [cursor=pointer]:
                - /url: "#pricing"
                - img [ref=e132]
            - paragraph [ref=e135]: "GPT‑5.6 pricing in Kiro aligns with the same two-tier context model that OpenAI and Amazon Bedrock both use. With this launch, credit multipliers for the GPT‑5.6 family have been updated. Requests up to 272K tokens are billed at the following short context rate:"
            - table [ref=e137]:
              - rowgroup [ref=e138]:
                - row "Model Kiro credit multiplier" [ref=e139]:
                  - columnheader "Model" [ref=e140]
                  - columnheader "Kiro credit multiplier" [ref=e141]
              - rowgroup [ref=e142]:
                - row "GPT‑5.6 Sol 4.4x" [ref=e143]:
                  - cell "GPT‑5.6 Sol" [ref=e144]
                  - cell "4.4x" [ref=e145]
                - row "GPT‑5.6 Terra 2.2x" [ref=e146]:
                  - cell "GPT‑5.6 Terra" [ref=e147]
                  - cell "2.2x" [ref=e148]
                - row "GPT‑5.6 Luna 1.1x" [ref=e149]:
                  - cell "GPT‑5.6 Luna" [ref=e150]
                  - cell "1.1x" [ref=e151]
            - paragraph [ref=e152]:
              - text: Requests that exceed 272K tokens are billed at double the short context rate, consistent with OpenAI's and Amazon Bedrock's long context pricing for GPT‑5.6. See the
              - link "models documentation" [ref=e153] [cursor=pointer]:
                - /url: /docs/models/
              - text: for the full comparison.
            - generic [ref=e154]:
              - heading "Availability" [level=2] [ref=e155]
              - link "Copy link to Availability section" [ref=e156] [cursor=pointer]:
