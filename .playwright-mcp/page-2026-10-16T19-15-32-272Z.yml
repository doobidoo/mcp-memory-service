            - paragraph [ref=e161]:
              - text: The 1M context for GPT‑5.6 Sol, Terra, and Luna is gradually rolling out
              - link "with experimental support" [ref=e162] [cursor=pointer]:
                - /url: /docs/models/available-models/#model-lifecycle
              - text: to Kiro Pro, Pro+, Pro Max, and Power customers.
              - link "Download Kiro" [ref=e163] [cursor=pointer]:
