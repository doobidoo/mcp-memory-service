            - heading "Claude Fable 5.1 is now available in Kiro" [level=1] [ref=e75]
            - generic [ref=e76]:
              - generic [ref=e77]: By
              - link "Vipin Mohan Product" [ref=e79] [cursor=pointer]:
                - /url: https://github.com/vipin-mohan/
                - generic [ref=e81]:
                  - paragraph [ref=e82]: Vipin Mohan
                  - paragraph [ref=e83]: Product
          - generic [ref=e84]:
            - paragraph [ref=e85]: Claude Fable 5.1 is available today to Kiro enterprise customers. For long-running, context-heavy agentic sessions, Fable 5.1 sets a new bar. It traces problems to their root causes in the code rather than surfacing symptoms, and it holds context and intent across the full arc of complex tasks.
            - paragraph [ref=e86]: "Kiro is built to deliver production-ready code — not early drafts that need cleaning up, not stubs that need filling in. Fable 5.1 in Kiro raises the ceiling across three types of work:"
            - list [ref=e87]:
              - listitem [ref=e88]:
                - paragraph [ref=e89]:
                  - strong [ref=e90]: Interactive tasks.
                  - text: On fast, back-and-forth coding sessions — fixing a bug, refactoring a function, unblocking a PR — Fable 5.1 is more precise. It understands what you’re actually trying to accomplish and gets there in fewer back-and-forth steps.
              - listitem [ref=e91]:
                - paragraph [ref=e92]:
                  - strong [ref=e93]: Long-running multi-step tasks.
                  - text: For large refactors and long autonomous runs, Kiro’s spec-driven workflows run to completion more reliably with Fable 5.1 — the model holds the plan across the full session without losing context or going off-track near the finish line.
              - listitem [ref=e94]:
                - paragraph [ref=e95]:
                  - strong [ref=e96]: Complex tasks with security or system-level work.
                  - text: Fable 5.1 brings improved convergence on hard problems that require reasoning across a large codebase.
            - generic [ref=e97]:
              - heading "More value from long agentic sessions" [level=2] [ref=e98]
              - link "Copy link to More value from long agentic sessions section" [ref=e99] [cursor=pointer]:
                - /url: "#more-value-from-long-agentic-sessions"
                - img [ref=e101]
            - paragraph [ref=e104]: Fable 5.1 is designed to get more efficient as sessions run longer. Kiro’s spec-driven approach also means the model stops early when a task isn’t going to succeed, rather than burning credits iterating on a dead end. For highly agentic work such as multi-file refactors, long autonomous runs, or sessions with heavy tool use, you’re getting Anthropic’s most capable model in Kiro.
            - generic [ref=e105]:
              - heading "Enabling Fable 5.1 for your organization" [level=2] [ref=e106]
              - link "Copy link to Enabling fable 51 for your organization section" [ref=e107] [cursor=pointer]:
                - /url: "#enabling-fable-51-for-your-organization"
                - img [ref=e109]
            - paragraph [ref=e112]:
              - text: Fable 5.1 is available to Kiro enterprise customers who have enabled
              - link "Model Governance" [ref=e113] [cursor=pointer]:
                - /url: /blog/enterprise-governance-mcp-and-models/
              - text: . To get started, open the Kiro settings in the AWS Management Console, turn on the Model availability toggle, and select Fable 5.1 from the model list. Once enabled, Fable 5.1 will appear in the model selector across all Kiro clients for every user. You’ll see a data retention notice indicating that AWS retains traffic for 30 days for abuse detection and that flagged traffic is subject to human review. If your organization needs to restrict access, Fable 5.1 can be disabled at any time from the same model settings page.
            - generic [ref=e114]:
              - heading "A note on safeguards" [level=2] [ref=e115]
              - link "Copy link to A note on safeguards section" [ref=e116] [cursor=pointer]:
                - /url: "#a-note-on-safeguards"
                - img [ref=e118]
            - paragraph [ref=e121]: Fable 5.1 ships with updated cybersecurity safeguards that are more precise than prior models. The classifiers have been tuned to better distinguish defensive security work from genuine threats, so you’ll see fewer interruptions on legitimate tasks. Fable 5.1 can now be used to discover software vulnerabilities, though tasks like exploit generation, binary-based vulnerability scanning, and penetration testing still redirect to Opus-class models in Kiro.
            - generic [ref=e122]:
              - heading "Availability" [level=2] [ref=e123]
              - link "Copy link to Availability section" [ref=e124] [cursor=pointer]:
                - /url: "#availability"
                - img [ref=e126]
            - paragraph [ref=e129]:
              - text: Claude Fable 5.1 is rolling out gradually
              - link "with experimental support" [ref=e130] [cursor=pointer]:
                - /url: /docs/models/available-models/#model-lifecycle
              - text: to Kiro enterprise customers in us-east-1 (IAD). It ships with a
              - strong [ref=e131]: 1M
              - text: context window and a
              - strong [ref=e132]: 6x credit multiplier
              - text: .
            - paragraph [ref=e133]:
              - text: Fable 5.1 requires
              - link "Model Governance" [ref=e134] [cursor=pointer]:
                - /url: /blog/enterprise-governance-mcp-and-models/
              - text: to be turned on in the AWS Management Console, with Fable 5.1 selected from the model list.
              - link "Download Kiro" [ref=e135] [cursor=pointer]:
                - /url: /downloads/
              - text: or restart the IDE or CLI to pick up the latest models.
              - link "Web users" [ref=e136] [cursor=pointer]:
                - /url: /web/
              - text: can refresh their browser.
