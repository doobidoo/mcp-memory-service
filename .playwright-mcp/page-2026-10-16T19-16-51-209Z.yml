      - article [ref=e96]:
        - paragraph [ref=e97]: Measurements for understanding the pace of AI development inside frontier labs
        - generic [ref=e98]:
          - paragraph [ref=e99]:
            - text: AI systems are becoming exponentially more powerful and have begun to
            - link "automate more" [ref=e100] [cursor=pointer]:
              - /url: https://www.anthropic.com/institute/recursive-self-improvement
            - text: of the process of building themselves. As the world considers
            - link "slowing the pace of frontier AI development" [ref=e101] [cursor=pointer]:
              - /url: https://darioamodei.com/post/we-must-pace-the-frontier
            - text: ", the public needs more information."
          - paragraph [ref=e102]: "In this post, we lay out measurement tools that can illuminate three critical aspects of AI development:"
          - list [ref=e103]:
            - listitem [ref=e104]:
              - link "The extent to which AI is building the next version of itself, as opposed to being built by humans" [ref=e105] [cursor=pointer]:
                - /url: "#1-measuring-ai-led-ai-rd"
            - listitem [ref=e106]:
              - link "Our ability to oversee and intervene in actions that AI agents take on Anthropic’s systems" [ref=e107] [cursor=pointer]:
                - /url: "#2-measuring-oversight-of-ai-agents"
            - listitem [ref=e108]:
              - link "The resources that power the development of more capable models" [ref=e109] [cursor=pointer]:
                - /url: "#3-measuring-compute-allocation"
          - paragraph [ref=e110]: We also provide a snapshot of these metrics from inside Anthropic. It’s important to note that we would expect these numbers to shift if there were coordination on pacing the frontier, as called for by Anthropic CEO Dario Amodei. We plan to embed independent third-party evaluators from multiple organizations at Anthropic, and give them access to internal processes, systems, and data comparable to what internal risk assessment teams have. These third parties will verify safety practices, report incidents, and monitor key metrics such as the ones in this piece.
          - paragraph [ref=e111]: We are reporting these measurements because they give the public, third parties, and governments better visibility into the pace of AI development inside frontier labs. For each measurement, we describe what we measured, what the measurement showed, and what it would take to publish these measurements regularly in a form others can verify. We share methodological details in the Appendix.
          - heading "Reasons to track these measurements" [level=2] [ref=e112]
          - paragraph [ref=e113]:
            - text: The measurements in this piece are focused on
            - emphasis [ref=e114]: how models are built.
            - text: By better understanding the production process of models, we have a better chance of correlating model inputs, like compute, with model outputs, like capabilities. They complement capability evaluations, which measure
            - emphasis [ref=e115]: what models can do
            - text: . We publish those separately through our
            - link "Responsible Scaling Policy" [ref=e116] [cursor=pointer]:
              - /url: https://www.anthropic.com/responsible-scaling-policy
            - text: (RSP) risk reports, which include evidence on how much our models are accelerating AI R&D. In our policy proposal on advanced AI, the
            - link "Advanced AI Framework (AAIF)" [ref=e117] [cursor=pointer]:
              - /url: https://www-cdn.anthropic.com/files/4zrzovbb/website/0a58d567024a8b448ff15158ebc3625328dfcc1f.pdf
            - text: ", we propose rules of the road for how any lab releases safe models, including transparency obligations that governments could require, such as risk reports. Together, these proposed measurements and policies are a starting point for monitoring the pace of AI development from outside the labs."
          - heading "(1) Measuring AI-led AI R&D" [level=2] [ref=e118]
          - paragraph [ref=e119]:
            - strong [ref=e120]: Why measure AI-led R&D?
            - text: Frontier AI labs increasingly use AI to build future AI models. This process allows labs in democratic countries to develop more capable models more quickly and conduct more safety and testing on models before they are released to secure AI’s benefits while staying on the frontier. However, models accelerating their own development could make it more challenging for humans to understand or control these systems. It is therefore important to share these metrics to understand how close the world is to reaching
            - link "recursive self improvement" [ref=e121] [cursor=pointer]:
              - /url: https://www.anthropic.com/institute/recursive-self-improvement
            - text: (a model fully autonomously building its successor).
          - paragraph [ref=e122]:
            - strong [ref=e123]: What we measured.
            - text: We built a prototype index of how much of Anthropic’s AI research and development (R&D) is performed by Claude, called the Anthropic R&D Automation Index. It’s built by cataloguing every kind of AI R&D work done at the company, rating how automated each task currently is, and aggregating those ratings.
          - paragraph [ref=e124]:
            - strong [ref=e125]: What we found.
            - text: To measure the extent to which AI is doing AI R&D at Anthropic, we use an
            - link "automation rating scale" [ref=e126] [cursor=pointer]:
              - /url: https://epochai.substack.com/p/toward-an-onet-for-ai-r-and-d
            - text: "developed by Epoch AI that measures “Automation Level,” or AL. It runs from AL0 (no AI involvement) to AL5 (AI operates fully autonomously, with no human in the loop). In AL3, AI “collaborates”: it can do large chunks of work under close human direction. In AL4, AI “leads”: it can complete most of the task end-to-end from a high-level prompt, while the human supervises."
            - superscript [ref=e127]:
              - link "Footnote 1" [ref=e128] [cursor=pointer]:
                - /url: "#footnote-1"
                - text: "1"
          - paragraph [ref=e129]: As of August 2026,
          - list [ref=e130]:
            - listitem [ref=e131]: Claude is not operating fully autonomously for any measured subset of AI R&D work.
            - listitem [ref=e132]: Claude “leads” 26% of Anthropic’s AI R&D work.
            - listitem [ref=e133]: The share of work at or above “AI collaborates” is above 90%.
          - figure [ref=e135]:
            - img "Chart showing Claude now leads 26% of Anthropic's model R&D tasks, up from under 1% in February 2026." [ref=e136]
          - paragraph [ref=e137]:
            - strong [ref=e138]: What any AI developer could report today.
            - text: Any frontier developer could publish these measures regularly, using a public methodology. This would enable the numbers to be compared over time, and potentially across labs.
          - paragraph [ref=e139]: Two obstacles stand in the way of cross-lab comparison on this type of reporting. First is the lack of a common methodology. Second, we’re using our own models to evaluate our systems, which could mean that the “judge” model could make the same kinds of errors as the model it is checking. To address these challenges, a developer’s measurements could be verified by a third party, or by other developers’ models, with guardrails in place to limit the exchange of competitively sensitive data. These measures could also become the trigger for stronger requirements, like a fixed testing window before a new model is used for further AI R&D.
          - heading "(2) Measuring oversight of AI agents" [level=2] [ref=e140]
          - paragraph [ref=e141]:
            - strong [ref=e142]: Why measure oversight of agents?
            - text: Like other frontier developers, Anthropic employees increasingly delegate tasks to agents that work semi-autonomously for long stretches, and that delegate work to one another. As work becomes increasingly automated, from “AI collaborates” toward “AI leads,” agents could make more consequential decisions, such as which research direction to pursue next.
          - paragraph [ref=e143]: These decisions need safeguards to block harmful behavior from an individual agent, as well as an oversight regime to detect problems that might only arise across many agents. In our monitoring data to date, individual agents rarely misbehave. But when there are millions or billions of agents operating in the economy, even rare events can happen regularly.
          - paragraph [ref=e144]:
            - strong [ref=e145]: What we measured.
            - text: "We’ve built a system that lets us oversee and intervene in actions AI agents take on Anthropic’s systems. Here, we consider three different metrics:"
            - emphasis [ref=e146]: coverage,
            - text: which describes the share of an agent’s actions that pass through a monitor before or after execution;
            - emphasis [ref=e147]: review
            - emphasis [ref=e148]: latency
            - text: ", which is the time between an action and its review, first by an automated monitor and then by a human; and"
            - emphasis [ref=e149]: escalation rate,
            - text: which
            - emphasis [ref=e150]
            - text: is the share of agent activities that are either blocked/redirected (in the case of online monitors) or flagged for further review (in the case of offline monitors).
          - paragraph [ref=e151]:
            - strong [ref=e152]: What we found.
            - text: "As of August 2026, there were approximately 30,000 agents doing research and engineering work at Anthropic at any one time in our most-used internal platform. These measurements cover this platform only. The actions of these agents are constrained by two kinds of monitors, summarized below:"
          - region [ref=e155]:
            - table [ref=e156]:
              - rowgroup [ref=e157]:
                - row "Online monitors Offline monitors" [ref=e158]:
                  - cell [ref=e159]
                  - cell "Online monitors" [ref=e160]:
                    - strong [ref=e161]: Online monitors
                  - cell "Offline monitors" [ref=e162]:
                    - strong [ref=e163]: Offline monitors
                - row "Description Online monitors check the actions of agents in real-time and either block dangerous actions or steer agent misbehavior automatically. They’re built to address harms that would happen quickly and could not be undone, such as an agent copying model weights out of our systems. Offline monitors read agent activities after the fact. They are built to help address dangerous behaviors that develop slowly and can be reversed, like signs of model misalignment. We use flagged activities to improve our mitigations, like classifiers and deterministic controls. If the situation caused a large imminent danger, we would shut down the dangerous parts of the agent’s deployment." [ref=e164]:
                  - cell "Description" [ref=e165]:
                    - strong [ref=e166]: Description
                  - cell "Online monitors check the actions of agents in real-time and either block dangerous actions or steer agent misbehavior automatically. They’re built to address harms that would happen quickly and could not be undone, such as an agent copying model weights out of our systems." [ref=e167]:
